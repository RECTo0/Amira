<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>hmmmmmmmm</title>

<style>
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:system-ui, Arial, sans-serif; background:#f5f6ff;
  }
  .card{ text-align:center; padding:16px; }
  .wrap{
    position:relative;
    width:min(420px, 92vw);
    aspect-ratio: 16 / 10; /* garde une hauteur stable */
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    margin: 0 auto;
    touch-action: none; /* IMPORTANT: évite le scroll pendant le grattage */
  }
  .wrap img, .wrap canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }
  .wrap canvas{ cursor:grab; }
  #message{
    margin-top:18px;
    font-size:20px;
    font-weight:650;
    opacity:0;
    transition:opacity .6s ease;
  }
</style>
</head>

<body>
  <div class="card">
    <h2>chno kayn hna 🤔​?</h2>

    <div class="wrap" id="wrap">
      <!-- Remplace l'image par ce que tu veux -->
      <img id="hiddenImage" src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.jpg/330px-FullMoon2010.jpg" alt="surprise">
      <canvas id="scratch"></canvas>
    </div>

    <div id="message">Walo ghi 9amar kaychouf f 9amar</div>
  </div>

<script>
  const wrap = document.getElementById("wrap");
  const canvas = document.getElementById("scratch");
  const ctx = canvas.getContext("2d");
  const message = document.getElementById("message");

  let isDrawing = false;

  function resizeCanvasToDisplaySize(){
    const rect = wrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    // Taille "réelle" du canvas = taille affichée * dpr
    canvas.width  = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);

    // On dessine en coordonnées "CSS pixels"
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Couche à gratter
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#cfcfcf";
    ctx.fillRect(0, 0, rect.width, rect.height);

    ctx.fillStyle = "#8a8a8a";
    ctx.font = "bold 22px Arial";
    ctx.fillText("7ki tl9ay rb7a", rect.width/2 - 70, rect.height/2 + 8);

    ctx.globalCompositeOperation = "destination-out";
  }

  function getPos(evt){
    const rect = canvas.getBoundingClientRect();
    const isTouch = evt.touches && evt.touches[0];
    const clientX = isTouch ? evt.touches[0].clientX : evt.clientX;
    const clientY = isTouch ? evt.touches[0].clientY : evt.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function scratchAt(x,y){
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.fill();
  }

  function checkReveal(){
    // On échantillonne des pixels (pas tous) pour aller vite
    const w = canvas.width, h = canvas.height;
    const img = ctx.getImageData(0, 0, w, h).data;

    let transparent = 0;
    // pas = 40 -> plus grand = plus rapide, moins précis
    const step = 40;
    for(let i=3; i<img.length; i += 4*step){
      if(img[i] === 0) transparent++;
    }
    const total = Math.floor(img.length / (4*step));

    if(transparent / total > 0.55){
      canvas.style.display = "none";
      message.style.opacity = 1;
    }
  }

  // Mouse
  canvas.addEventListener("mousedown", (e)=>{ isDrawing=true; const p=getPos(e); scratchAt(p.x,p.y); checkReveal(); });
  window.addEventListener("mouseup", ()=> isDrawing=false);
  canvas.addEventListener("mousemove", (e)=>{
    if(!isDrawing) return;
    const p = getPos(e);
    scratchAt(p.x,p.y);
    checkReveal();
  });

  // Touch (mobile)
  canvas.addEventListener("touchstart", (e)=>{ e.preventDefault(); isDrawing=true; const p=getPos(e); scratchAt(p.x,p.y); checkReveal(); }, {passive:false});
  canvas.addEventListener("touchend", ()=> isDrawing=false);
  canvas.addEventListener("touchmove", (e)=>{
    e.preventDefault();
    if(!isDrawing) return;
    const p = getPos(e);
    scratchAt(p.x,p.y);
    checkReveal();
  }, {passive:false});

  // Init + resize
  resizeCanvasToDisplaySize();
  window.addEventListener("resize", resizeCanvasToDisplaySize);
</script>
</body>
</html>
